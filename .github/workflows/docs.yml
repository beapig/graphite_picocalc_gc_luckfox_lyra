name: Docs

on:
  push:
    branches: [main, docs/site]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-docs:
    name: Validate markdown
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate markdown
        run: python3 scripts/validate_md.py docs-site/ docs/ AGENTS.md README.md

  check-reference:
    name: Reference docs match firmware source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Regenerate docs-site/reference/
        run: python3 scripts/gen-doc-reference.py
      - name: Fail if generated docs drifted from committed output
        run: |
          if ! git diff --exit-code docs-site/reference/; then
            echo "::error::docs-site/reference/ is out of date — run" \
              "'python3 scripts/gen-doc-reference.py' and commit the result."
            exit 1
          fi

  build-offline:
    name: Build offline bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pandoc (optional — HTML/PDF output)
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build offline bundle
        run: ./scripts/gen-offline.sh
      - name: Upload offline bundle
        uses: actions/upload-artifact@v7
        with:
          name: picocalc-gc-offline-docs
          path: build/offline/

  publish-wiki:
    name: Publish wiki
    runs-on: ubuntu-latest
    needs: [validate-docs, check-reference]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.WIKI_TOKEN != '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build wiki tree
        run: ./scripts/gen-wiki.sh
      - name: Push to wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git" /tmp/gpc-wiki
          rsync -a --delete --exclude .git build/wiki/ /tmp/gpc-wiki/
          cd /tmp/gpc-wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "Sync wiki from docs-site/ ($GITHUB_SHA)"
            git push
          fi

  # GITHUB_TOKEN cannot push to a repo's wiki (a separate git remote
  # GitHub does not extend the default token's permissions to), so the
  # publish-wiki job above is gated on a WIKI_TOKEN secret and simply
  # doesn't run until one is configured. See docs-site/README.md
  # "Publishing to the wiki" for the one-time PAT setup and the manual
  # fallback.
